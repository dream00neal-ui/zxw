<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的人脉 · 版本切换演示（尊享版/标准版） · 中项网</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.ver-btn{display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;cursor:pointer;border:2px solid #e2e8f0;background:#fff;transition:all .15s}
.ver-btn:hover{border-color:#93c5fd}
.ver-btn.active{border-color:#2563eb;background:#eff6ff;box-shadow:0 2px 8px rgba(37,99,235,.15)}
.ver-btn .dot{width:10px;height:10px;border-radius:50%}
</style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen flex flex-col overflow-hidden">

  <!-- 顶部版本切换栏 -->
  <div class="bg-white border-b border-gray-200 px-5 py-3 flex items-center gap-4 flex-shrink-0 flex-wrap">
    <div>
      <div class="text-base font-bold text-gray-900">👥 我的人脉 · 产品版本演示</div>
      <div class="text-[12px] text-gray-400 mt-0.5">同一浏览器内按产品层级切换：尊享版（找人脉模块）↔ 标准版（找客户·我的人脉管理）</div>
    </div>
    <div class="flex items-center gap-3 ml-auto">
      <div id="ver-premium" class="ver-btn active" onclick="switchVer('premium')">
        <span class="dot" style="background:#d97706"></span>
        <div>
          <div class="text-[14px] font-bold text-gray-900">尊享版</div>
          <div class="text-[11px] text-gray-400">我的人脉商机 · 找人脉模块</div>
        </div>
      </div>
      <div id="ver-standard" class="ver-btn" onclick="switchVer('standard')">
        <span class="dot" style="background:#64748b"></span>
        <div>
          <div class="text-[14px] font-bold text-gray-900">标准版</div>
          <div class="text-[11px] text-gray-400">我的人脉管理 · 归属找客户</div>
        </div>
      </div>
    </div>
    <div id="ver-desc" class="w-full text-[12px] leading-relaxed bg-amber-50 border border-amber-200 text-amber-900 rounded-lg px-3 py-1.5"></div>
  </div>

  <!-- 版本内容区（整页切换） -->
  <iframe id="ver-frame" src="我的人脉商机-尊享版.html" class="flex-1 w-full border-0 bg-white"></iframe>

<script>
const VER = {
  premium: {
    file: '我的人脉商机-尊享版.html',
    desc: '👑 尊享版能力：人脉商机推荐流（直接/间接穿透、多路径聚合、路径说明、筛选搜索）· 全部人脉（联系人+公司资产）· 可能认识的人（推荐增长）· 商机穿透分析。菜单结构：独立「找人脉」模块（工程人脉查询/找更多联系人/我的人脉商机）。',
  },
  standard: {
    file: '我的人脉管理-标准版.html',
    desc: '⚙️ 标准版能力：我的人脉管理（归属「找客户」，人脉=客户资源管理）——导入/标记合作/资产管理 · 合作人脉（标记落点）· 穿透项目（仅直接、限量20条，间接穿透为尊享版能力，见锁定区升级入口）。',
  },
};
function switchVer(v){
  document.getElementById('ver-premium').classList.toggle('active', v==='premium');
  document.getElementById('ver-standard').classList.toggle('active', v==='standard');
  document.getElementById('ver-desc').textContent = VER[v].desc;
  document.getElementById('ver-frame').src = VER[v].file;
}
switchVer('premium');
</script>
</body>
</html>
